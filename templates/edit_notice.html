{% extends "layout.html" %}

{% block body %}

<div class="card shadow-sm">
    <div class="card-body">

        <h2 class="mb-4">Edit Notice</h2>

        <form action="/edit/{{ notice.id }}" method="post" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">Notice Title</label>
                <input
                    type="text"
                    class="form-control"
                    name="title"
                    value="{{ notice.title }}"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea
                    class="form-control"
                    name="description"
                    rows="5"
                    required>{{ notice.description }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Department</label>

                <select class="form-select" name="department" required>

                    {% for department in departments %}

                    <option
                        value="{{ department }}"
                        {% if notice.department == department %}selected{% endif %}>
                        {{ department }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">
                <label class="form-label">Year</label>

                <select class="form-select" name="year" required>

                    {% for year in years %}

                    <option
                        value="{{ year }}"
                        {% if notice.year == year %}selected{% endif %}>
                        {{ year }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>

                <select class="form-select" name="category" required>

                    {% for category in categories %}

                    <option
                        value="{{ category }}"
                        {% if notice.category == category %}selected{% endif %}>
                        {{ category }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Replace Attachment (Optional)
                </label>

                <input
                    type="file"
                    class="form-control"
                    name="attachment"
                    accept=".pdf,.png,.jpg,.jpeg">

            </div>

            {% if notice.attachment %}

            <div class="mb-4">
                <a
                    href="{{ url_for('static', filename='uploads/' ~ notice.attachment) }}"
                    target="_blank"
                    class="btn btn-outline-primary btn-sm">
                    📎 View Current Attachment
                </a>
            </div>

            {% endif %}

            <button class="btn btn-primary">
                Update Notice
            </button>

        </form>

    </div>
</div>

{% endblock %}

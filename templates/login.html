{% extends "layout.html" %}

{% block body %}

<h2>Admin Login</h2>

<form action="/login" method="post">

    <input
        class="form-control mb-3"
        name="username"
        placeholder="Username"
    >

    <input
        class="form-control mb-3"
        type="password"
        name="password"
        placeholder="Password"
    >

    <button class="btn btn-primary">
        Login
    </button>

</form>

{% endblock %}
